name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check src tests scripts

      - name: Type check with ty
        run: uv run ty check src

      - name: Run test suite
        run: uv run pytest -q
