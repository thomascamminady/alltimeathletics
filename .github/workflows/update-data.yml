name: Update data

on:
  schedule:
    # Sundays 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + sync deps
        run: uv sync --frozen

      - name: Scrape + parse + write parquet
        run: uv run python -m alltimeathletics.pipeline

      - name: Validate parquet schema and known marks
        run: uv run pytest tests/test_pipeline_schema.py -v

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update auto-merge PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="data-update-$DATE"
          git config user.name "alltimeathletics-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "data: weekly refresh ($DATE)"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --title "Weekly data refresh ($DATE)" \
              --body "Automated scrape of alltime-athletics.com. Auto-merging once checks pass." \
              --base main \
              --head "$BRANCH"
            gh pr merge "$BRANCH" --auto --squash --delete-branch
          fi
