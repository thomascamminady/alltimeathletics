name: Update data (daily)

# Daily refresh of the alltime-athletics mirror.
#
# Flow
# ----
# 1. Scrape every event page (sequential, polite UA, ~3 min total).
# 2. Parse → ``data/alltime_athletics.parquet`` + ``data/manifest.json``.
# 3. Run the schema + audit tests against the freshly produced parquet.
#    The audit fails loudly if any new unexplained mismatch appears.
# 4. If ``data/`` is unchanged: exit clean (no PR, no release, no deploy).
#    The diff check is the gate — most days nothing has changed and the
#    job exits in ~3 min without spending bandwidth on a redeploy.
# 5. Otherwise:
#    a. Commit the parquet + manifest straight to ``main`` (signed by the
#       Actions bot; the parquet is ~4 MB so no LFS needed).
#    b. Generate ``alltime_athletics.csv`` (~70 MB) and a gzip'd version
#       (~10 MB) on the runner — these don't go in git.
#    c. Cut a dated GitHub Release ``data-YYYY-MM-DD`` with the parquet,
#       CSV, gzipped CSV, and manifest attached as assets.
#
# Users get stable download URLs that always point at the latest snapshot::
#
#     https://github.com/<owner>/<repo>/releases/latest/download/alltime_athletics.parquet
#     https://github.com/<owner>/<repo>/releases/latest/download/alltime_athletics.csv
#     https://github.com/<owner>/<repo>/releases/latest/download/alltime_athletics.csv.gz
#     https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# Each weekly tag also stays around as a versioned snapshot, so consumers
# can pin to a specific date if they want reproducibility.

on:
  schedule:
    # Daily at 04:00 UTC. Larsson posts updates throughout the week, so
    # checking once a day keeps the mirror fresh; the diff gate (step 4)
    # ensures no commit/deploy happens on days where nothing has changed.
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # also runnable from the Actions tab

permissions:
  contents: write  # commit to main + create releases

concurrency:
  # If a manual dispatch fires while the cron run is in flight, queue it.
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can push a commit back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Scrape + parse
        # Use a run-local --cache-dir so the audit step (next) can re-read
        # the same HTML the parser saw. The cache is discarded when the
        # runner finishes — each weekly run still fetches everything fresh.
        run: uv run python -m alltimeathletics.pipeline --cache-dir .cache

      - name: Validate freshly produced parquet
        run: |
          uv run pytest \
            tests/test_pipeline_schema.py \
            tests/test_qoi.py \
            tests/test_data_access.py \
            tests/test_audit.py \
            -v

      - name: Detect changes in data/
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes; nothing to commit or release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: Generate CSV + gzipped CSV
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv run python -c "
          import polars as pl
          df = pl.read_parquet('data/alltime_athletics.parquet')
          df.write_csv('alltime_athletics.csv')
          " >&2
          gzip --keep --best alltime_athletics.csv
          ls -lh alltime_athletics.csv* data/alltime_athletics.parquet data/manifest.json

      - name: Commit parquet + manifest to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alltime_athletics.parquet data/manifest.json
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)

          Auto-generated by .github/workflows/update-data.yml.
          Row count and per-event diagnostics in data/manifest.json."
          git push origin HEAD:main

      - name: Cut dated release with CSV + parquet attached
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          ROWS=$(uv run python -c "import json; print(json.load(open('data/manifest.json'))['n_rows'])")
          gh release create "data-$DATE" \
            data/alltime_athletics.parquet \
            data/manifest.json \
            alltime_athletics.csv \
            alltime_athletics.csv.gz \
            --title "Weekly data snapshot $DATE" \
            --notes "Automated weekly refresh of Peter Larsson's alltime-athletics.com data.

          - **${ROWS} rows** across all events
          - Source: https://www.alltime-athletics.com/

          ## Download

          Stable URLs (always point at the latest snapshot):

          - Parquet: https://github.com/${{ github.repository }}/releases/latest/download/alltime_athletics.parquet
          - CSV: https://github.com/${{ github.repository }}/releases/latest/download/alltime_athletics.csv
          - CSV (gzipped): https://github.com/${{ github.repository }}/releases/latest/download/alltime_athletics.csv.gz
          - Manifest (per-event row counts + parser diagnostics): https://github.com/${{ github.repository }}/releases/latest/download/manifest.json

          See [README](https://github.com/${{ github.repository }}#readme) for the schema."
