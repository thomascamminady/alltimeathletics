{% extends "base.html" %}
{% block title %}Athletes — All-Time Athletics{% endblock %}
{% block main %}
<div class="table-toolbar">
  <a href="{{ site_root }}index.html" class="btn">Home</a>
</div>

<h1>Athletes <span class="meta-tag">{{ n_athletes }} on the all-time lists</span></h1>

<p class="lede">
  Showing <span id="visible-count">{{ n_athletes }}</span> athletes.
  Click a column header to sort. Type into the column headers to filter.
</p>

<div id="table"></div>

<script src="{{ static_root }}tabulator.min.js"></script>
<script>
const SITE_ROOT = {{ site_root|tojson }};
const FLAGS = {{ flags_json|safe }};
const dataUrl = "{{ site_root }}athlete/index.json";

function fmtCountry(code) {
  if (!code) return "";
  const flag = FLAGS[code];
  return flag ? flag + " " + code : code;
}

const columns = [
  { title: "Name", field: "name", headerFilter: "input", minWidth: 180,
    formatter: (cell) => {
      const row = cell.getRow().getData();
      const name = cell.getValue() || "";
      if (!row.slug) return name;
      return `<a href="${SITE_ROOT}athlete/${row.slug}.html">${name}</a>`;
    },
  },
  { title: "Country", field: "country", width: 110, headerFilter: "input",
    formatter: (cell) => fmtCountry(cell.getValue()) },
  { title: "DOB", field: "dob", width: 110, headerFilter: "input" },
  { title: "Primary event", field: "primary_label", headerFilter: "input", minWidth: 140 },
  { title: "Best mark", field: "best_mark_raw", width: 110, hozAlign: "right", headerFilter: "input",
    sorter: (a, b, ar, br, _col, dir) => {
      const av = ar.getData().best_mark_value;
      const bv = br.getData().best_mark_value;
      if (av == null && bv == null) return 0;
      if (av == null) return dir === "desc" ? -1 : 1;
      if (bv == null) return dir === "desc" ? 1 : -1;
      return av - bv;
    },
  },
  { title: "Best rank", field: "best_rank", width: 100, hozAlign: "right", sorter: "number", headerFilter: false },
  { title: "Career", field: "career_start", width: 120, headerFilter: false,
    formatter: (cell) => {
      const row = cell.getRow().getData();
      if (!row.career_start) return "";
      return row.career_start === row.career_end
        ? String(row.career_start)
        : `${row.career_start}–${row.career_end}`;
    },
  },
  { title: "Events", field: "n_events", width: 80, hozAlign: "right", sorter: "number", headerFilter: false },
  { title: "Entries", field: "n_entries", width: 80, hozAlign: "right", sorter: "number", headerFilter: false },
];

function refreshCount(_filters, rows) {
  const n = (rows && rows.length) ?? table.getDataCount("active");
  const el = document.getElementById("visible-count");
  if (el) el.textContent = n.toLocaleString();
}

const table = new Tabulator("#table", {
  ajaxURL: dataUrl,
  layout: "fitDataStretch",
  maxHeight: "70vh",
  pagination: "local",
  paginationSize: 100,
  paginationSizeSelector: [50, 100, 250, 1000, true],
  movableColumns: true,
  columns: columns,
  initialSort: [{ column: "best_rank", dir: "asc" }],
});
table.on("dataFiltered", refreshCount);
</script>
{% endblock %}
